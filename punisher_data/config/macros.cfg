[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
  {% set X = params.X|default(printer.configfile.config["stepper_x"]["position_endstop"]|string)|int %}
  {% set Y = params.Y|default(printer.configfile.config["stepper_y"]["position_endstop"]|string)|int %}
  {% set Z = params.Z|default(50)|int %}
#  _CLEAR_RETRACTION
  SAVE_GCODE_STATE NAME=PAUSE_state
  BASE_PAUSE
        G91
        G1 E-2 F3000
        G1 Z{Z}
        G90
        G1 X{X} Y{Y} F3000  ; park & home position


[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
  G91
  G1 E1 F2100
  G90
  RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
  BASE_RESUME


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
  {% set X = params.X|default(printer.configfile.config["stepper_x"]["position_endstop"]|string)|int %}
  {% set Y = params.Y|default(printer.configfile.config["stepper_y"]["position_endstop"]|string)|int %}
  {% set Z = params.Z|default(50)|int %}
#  _CLEAR_RETRACTION
  TURN_OFF_HEATERS
  CLEAR_PAUSE
#  SDCARD_RESET_FILE
        G91
        G1 E-5 F2100
        G1 Z{Z}
        G90
        G1 X{X+10} Y{Y+10} F3000  ; park & home position
  BASE_CANCEL_PRINT


# Precise Homing
[gcode_macro PRECISE_HOME]
gcode:
  G28
  M420


# Do nozzle priming
[gcode_macro PRIME_EXTRUDER]
gcode:
#    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(170) | float %}
    M117 Priming Line
    G92 E0
    G1 X2.1 Y10 Z0.5 F3000  # F3000mm/m = 50mm/s
    G4 P2000
    G1 X2.1 Y270 Z0.32 F1800.0 E45; Draw the first line F1800mm/m = 30mm/s
    G92 E0
    G1 F2400 E-10.0 # Small retract to remove pressure F2400mm/m = 40mm/s
    G92 E0
    M106 S200
    G1 Z10.0 F1020 ;Move Z Axis up  F1020mm/m = 17mm/s
    TIP_CLEAN
    M106 S0
    SMART_PARK
    M117 Away We Go


[gcode_macro START_PRINT]
gcode:
    _SET_MPC_MATERIAL MATERIAL={params.MATERIAL}
        {% set BED_TEMP = params.BED_TEMP|default(80) | float %}
        {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(170) | float %}
        # Start bed heating
        M117 PRE-Heating bed
          M140 S{BED_TEMP}  # Bed Temp
            # Start nozzle heating
          M117 PRE-Heating nozzle
          M104 S180   
            # Use absolute coordinates
          G90
          M73
            # Reset the G-Code Z offset (adjust Z offset if needed)
          SET_GCODE_OFFSET Z=0.0
            # Home the printer
          _B28
          TIP_CLEAN
            # Move the nozzle near the bed
          G1 Z5 F3000
            # Move the nozzle very close to the bed
          G1 Z0.90 F300
            # Wait for bed to reach temperature
          M190 S{BED_TEMP}
            # Check Z Axis Tilt       
          Z_TILT_ADJUST
           # Double check HOME after Z Tilt
          _B28
            #Calibrate Bed Mesh
          PROBE_EDDY_NG_TAP
          BED_MESH_CALIBRATE
#          EDDYNG_BED_MESH_EXPERIMENTAL
          M117 Adaptive Mesh
            # Set and wait for nozzle to reach temperature
          M109 S{EXTRUDER_TEMP}
            # Prime Extruder/line
          ZEROG_PURGE
#          PRIME_EXTRUDER # Brad's Prime line
#          G1 F2400 E11
#          G92 E0
#         LINE_PURGE   ## KAMP Line Purge MACRO, purges near printed object instead of on edge of plate
#         G1 F2400 E1.0
#         G92 E0


[gcode_macro END_PRINT]
gcode: 
  G91 ; Relative positioning
  G1 E-3.0 Z30 F2700 ; Retract and lift Z
  G90 ; Absolute positioning
  G1 X35 Y300 F6000 ; end print X Y axis
#  M104 S0 ; turn off temperature
#  M140 S0 ; turn off heatbed
#  M107 ; turn off fans
  TURN_OFF_HEATERS
  PART_COOLING_FAN_ON
  G4 P80000
  PART_COOLING_FAN_OFF
  M84  ; turn off steppers
  M221 S100  ; Reset flow to 100%
  M220 S100 ; Reset Feedrate to 100%
  _ADD_MAINTENANCE_TIMER ; add print time to maintenance 
  M117 Complete & Let Bed Cool!
  

[gcode_macro m201]
description: Sets maximum acceleration.
  Usage: M201 [X<accel>] [Y<accel>]
variable_max_accel: 1.7976931348623157e+308
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% if 'X' in params or 'Y' in params %}
    {% set accel = (params.X|default(params.Y)|float,
                    params.Y|default(params.X)|float)|min %}
    SET_GCODE_VARIABLE MACRO=m201 VARIABLE=max_accel VALUE="{accel}"
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}


[gcode_macro m203]
description: Sets maximum velocity.
  Usage: M203 [X<velocity>] [Y<velocity>]
gcode:
  {% if 'X' in params or 'Y' in params %}
    {% set velocity = (params.X|default(params.Y)|float,
                      params.Y|default(params.X)|float)|min %}
    SET_VELOCITY_LIMIT VELOCITY="{velocity}"
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}


[gcode_macro m205]
description: Sets square corner velocity.
  Usage: M203 [X<velocity>] [Y<velocity>]
gcode:
  {% if 'X' in params or 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY="{
      (params.X|default(0)|float, params.Y|default(0)|float)|min}"
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}


[gcode_macro m900]
description: Sets pressure advance.
  Usage: M900 [K<advance>] [T<extruder_index>]
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% if km.pressure_advance_scale > 0.0 %}
    {% set extruder = "extruder" ~ params.T|replace('0', '')
      if "T" in params else printer.toolhead.extruder %}
    {% if 'K' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER="{extruder}" ADVANCE="{
        params.K|float * km.pressure_advance_scale}"
    {% endif %}
  {% endif %}


[gcode_macro _reset_velocity_limits]
description: Sets maximum acceleration.
  Usage: M204 [S<accel>] [P<accel> T<accel>]
gcode:
  SET_GCODE_VARIABLE MACRO=m201 VARIABLE=max_accel VALUE="{1.7976931348623157e+308}"


[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
      "spoolman_set_active_spool",
      spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}


[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}


[gcode_macro ZEROG_PURGE]
description: A purge macro that adapts to be near your actual printed objects

variable_adaptive_enable: True      # Change to False if you'd like the purge to be in the same spot every print
variable_z_height: 0.38              # Height above the bed to purge
variable_tip_distance: 10           # Distance between filament tip and nozzle before purge (this will require some tuning)
variable_purge_amount: 30         # Amount of filament to purge (40)
variable_flow_rate: 21              # Desired flow rate in mm3/s (20)
variable_x_default: 10              # X location to purge, overwritten if adaptive is True
variable_y_default: 10              # Y location to purge, overwritten if adaptive is True
variable_size: 30                   # Size of the logo (30)
variable_distance_to_object_x: 10   # Distance in x to the print area
variable_distance_to_object_y: 10   # Distance in y to the print area

### This section is for those who are using Moonraker's Update Manager for KAMP, or want a more verbose macro. ###

variable_display_parameters: True   # Display macro paramters in the console, useful for debugging the SETUP_ZEROG_PURGE call, or more verbosity.

gcode:

    {% if display_parameters == True %}
      { action_respond_info("adaptive_enable : %d" % (adaptive_enable))  }
      { action_respond_info("z_height        : %f" % (z_height))  }
      { action_respond_info("tip_distance    : %f" % (tip_distance))  }
      { action_respond_info("purge_amount    : %f" % (purge_amount))  }
      { action_respond_info("flow_rate       : %f" % (flow_rate))  }
      { action_respond_info("x_default       : %f" % (x_default))  }
      { action_respond_info("y_default       : %f" % (y_default))  }
      { action_respond_info("size            : %f" % (size))  }
      { action_respond_info("distance_to_object_x : %f" % (distance_to_object_x))  }
      { action_respond_info("distance_to_object_y : %f" % (distance_to_object_y))  }
    {% endif %}

    {% if adaptive_enable == True %}
        {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
        {% set x_origin = (all_points | map(attribute=0) | min | default(x_default + distance_to_object_x + size)) - distance_to_object_x - size %}
        {% set y_origin = (all_points | map(attribute=1) | min | default(y_default + distance_to_object_y + size)) - distance_to_object_y - size %}
        {% set x_origin = ([x_origin, 0] | max) %}
        {% set y_origin = ([y_origin, 0] | max) %}
    {% else %}
        {% set x_origin = x_default | float %}
        {% set y_origin = y_default | float %}
    {% endif %}
    {% set purge_move_speed = 2.31 * size * flow_rate / (purge_amount * 2.405) %}
    {% set prepurge_speed = flow_rate / 2.405 %}
    {% set travel_speed = printer.toolhead.max_velocity %}
    { action_respond_info( "x: " + x_origin|string + " y: " + y_origin|string + " purge_move_speed: " + purge_move_speed|string + " prepurge_speed: " + prepurge_speed|string ) }


    G92 E0                                                                              # Reset extruder
    G0 F{travel_speed*30}                                                               # Set travel speed
    G90                                                                                 # Absolute positioning
    G0 X{x_origin+size*0.7} Y{y_origin+size*0.5}                                        # Move to purge position
    G0 Z{z_height}                                                                      # Move to purge Z height
    M83                                                                                 # Relative extrusion mode
    G1 E{tip_distance} F{prepurge_speed*60}                                             # Move tip of filament to nozzle
    
    #Draw me like one of your french girls    
    G0 X{x_origin+size}     Y{y_origin+size*0.7} E{purge_amount*0.080} F{purge_move_speed*60}
    G0 X{x_origin+size}     Y{y_origin+size*0.4} E{purge_amount*0.067} F{purge_move_speed*60}
    G0 X{x_origin+size*0.5} Y{y_origin}          E{purge_amount*0.142} F{purge_move_speed*60}
    G0 X{x_origin}          Y{y_origin+size*0.4} E{purge_amount*0.142} F{purge_move_speed*60}
    G0 X{x_origin+size}     Y{y_origin+size}     E{purge_amount*0.259} F{purge_move_speed*60}
    G0 X{x_origin}          Y{y_origin+size}     E{purge_amount*0.222} F{purge_move_speed*60}
    G0 X{x_origin}          Y{y_origin+size*0.6} E{purge_amount*0.089} F{purge_move_speed*60}

    G1 E-.5 F3100                                                                       # Retract
    G0 Z{z_height*2}                                                                    # Z hop

    G92 E0                                                                              # Reset extruder distance
    M82                                                                                 # Absolute extrusion mode

[gcode_macro SETUP_ZEROG_PURGE]
gcode:
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=display_parameters   VALUE={params.DISPLAY_PARAMETERS|default(True)|int}
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=adaptive_enable   VALUE={params.ADAPTIVE_ENABLE|default(True)|int}
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=z_height      VALUE={params.Z_HEIGHT|default(0.4)|float}
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=tip_distance  VALUE={params.TIP_DISTANCE|default(10)|float}
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=purge_amount  VALUE={params.PURGE_AMOUNT|default(40)|float}
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=flow_rate     VALUE={params.FLOW_RATE|default(20)|float}
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=x_default     VALUE={params.X_DEFAULT|default(10)|float}
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=y_default     VALUE={params.Y_DEFAULT|default(10)|float}
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=size          VALUE={params.SIZE|default(30)|float}
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=distance_to_object_x     VALUE={params.DISTANCE_TO_OBJECT_X|default(10)|float}
    SET_GCODE_VARIABLE MACRO=ZEROG_PURGE  VARIABLE=distance_to_object_y     VALUE={params.DISTANCE_TO_OBJECT_Y|default(10)|float}