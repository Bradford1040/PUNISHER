######################################################################
####                        EXTRUDER                              ####
####                       THERMISTOR                             ####
######################################################################

[thermistor Trianglelab-NTC100K-B3950]
temperature1: 25
resistance1: 103180
temperature2: 150
resistance2: 1366.2
temperature3: 250
resistance3: 168.6

[temperature_sensor skr3]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 85

[temperature_sensor accel_s2dw]
sensor_type: temperature_mcu
sensor_mcu: btt_lis2dw
min_temp: 0
max_temp: 85

[temperature_sensor rhino]
sensor_type: temperature_host
min_temp: 10
max_temp: 105

[temperature_sensor eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

