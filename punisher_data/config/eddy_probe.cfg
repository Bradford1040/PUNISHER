[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_45474E621B0CF60A-if00
restart_method: command
is_non_critical: True

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: -37 # INSERT VALUE FOR YOUR PROBE POSITION
y_offset: -2 # INSERT VALUE FOR YOUR PROBE POSITION 

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: -20
max_temp: 130

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26