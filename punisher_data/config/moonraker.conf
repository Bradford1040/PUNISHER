[server]
host: 0.0.0.0
port: 7132
ssl_port: 7144
klippy_uds_address: /home/octo/punisher_data/comms/klippy.sock


[authorization]
trusted_clients:
    10.0.0.0/16
    127.0.0.0/16
    10.0.0.190
    FE80::/10
    ::1/128
cors_domains:
    *.lan
    *.local
    *.internal
    *://localhost
    *://localhost:*
    *://rhino*
    *://10.0.0.138
    *://my.mainsail.xyz
    *://*.local


[include secrets.conf]    


[octoprint_compat]


[history]

#[timelapse]
#output_path: ~/punisher_data/timelapse/
#frame_path: /tmp/timelapse/punisher
#ffmpeg_binary_path: /usr/bin/ffmpeg

[file_manager]
enable_object_processing: True
queue_gcode_uploads: True
#check_klipper_config_path: True # deprecated
file_system_observer: inotify
enable_observer_warnings: True
enable_config_write_access: True

[spoolman]
server: http://rhino:7912
sync_rate: 5


[update_manager]
channel: dev # Other option are "beta", or "stable"
refresh_interval: 36 # number is in hours!
enable_system_updates: False
enable_auto_refresh: True


[update_manager mainsail]
type: web
#primary_branch: develop
channel: stable
repo: mainsail-crew/mainsail
path: ~/mainsail


